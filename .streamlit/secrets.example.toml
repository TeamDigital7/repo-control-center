# =============================================================================
# Repo Control Center - secrets
# =============================================================================
# Copia este archivo como .streamlit/secrets.toml (NUNCA lo subas a GitHub:
# el .gitignore ya lo excluye) o pegalo en Streamlit Cloud > Settings > Secrets.
#
# Esta app SOLO necesita el bloque [app_auth]. Los demas bloques estan aqui con
# la misma estructura del Catalogo Control Center para que puedas pegar tus
# secrets tal cual los tienes alla y solo agregar/quitar usuarios.
# Lo que sobre se ignora sin dar error.
# =============================================================================


# -----------------------------------------------------------------------------
# OBLIGATORIO: usuarios que pueden entrar
# -----------------------------------------------------------------------------
[app_auth]
# Opcion A - un solo usuario:
# username = "admin"
# password = "CAMBIAR_ESTA_CLAVE"

# Opcion B - varios usuarios (recomendado). Si existe [app_auth.users],
# reemplaza por completo a los usuarios por defecto del codigo.
[app_auth.users]
"admin" = "CAMBIAR_ESTA_CLAVE"
"hugo.camara@forus.pe" = "CAMBIAR_ESTA_CLAVE"
"luis.nunez@forus.pe" = "CAMBIAR_ESTA_CLAVE"
# Agrega aqui a quien mas deba usar la app, una linea por persona:
# "nombre.apellido@forus.pe" = "CAMBIAR_ESTA_CLAVE"


# =============================================================================
# BIGQUERY - opcional pero recomendado
# -----------------------------------------------------------------------------
# Si pegas estos dos bloques (son los MISMOS del Catalogo Control Center),
# la app habilita:
#   · traer la venta por rango de fechas en vez de subir el TXT / el Excel
#   · llenar el directorio de SKU desde ARTI de una sola vez
# Sin ellos la app funciona igual, solo que subiendo los archivos a mano.
# =============================================================================

[bigquery]
enabled = true
project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"
job_project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"

# Tabla de venta. Si no la pones, se usa esta por defecto.
ventas_table = "forus-analitica-prod-datalake.silver.ft_pe_reporteria_ventas_tablon"

# Maestro de productos, para completar los ID Producto y los codigos de barras.
product_master_table = "forus-analitica-prod-datalake.bronze.stg_pe_central_arti"

# Heredados del Catalogo Control Center: esta app los ignora.
# table = "PROYECTO.DATASET.TABLA_ARTI"
# location = "US"

[gcp_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "tu-service-account@tu-project.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."


# =============================================================================
# OPCIONAL - bloques heredados del Catalogo Control Center.
# Esta app no los usa. Estan solo para que puedas pegar tus secrets completos
# sin editarlos. Puedes borrar todo lo que sigue sin ningun problema.
# =============================================================================

