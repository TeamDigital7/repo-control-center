# -----------------------------------------------------------------------------
# Tablas de pedidos (opcional)
# -----------------------------------------------------------------------------
# NO agregues estas lineas salvo que tus tablas esten en otro proyecto o dataset.
# El codigo ya apunta por defecto a:
#   forus-analitica-prod-datalake.bronze.stg_pe_perucentral_pedidos_header
#   forus-analitica-prod-datalake.bronze.stg_pe_perucentral_pedidos_detail
#
# Si las agregas, van DENTRO del bloque [bigquery] de mas arriba (no repitas el
# encabezado: TOML lo rechaza por clave duplicada) y con el proyecto y dataset
# de verdad. Si quedan con un texto de ejemplo, la app te lo dice al entrar.
#
# pedidos_header_table = "forus-analitica-prod-datalake.bronze.mi_tabla_header"
# pedidos_detail_table = "forus-analitica-prod-datalake.bronze.mi_tabla_detail"
